<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #c51e72, #650c5f);
            padding: 20px;
        }
        
        .container {
            background: rgb(199, 191, 196);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            width: 320px;
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 10px;
            background: #e9d3d3;
            border-radius: 5px;
        }
        
        .player-turn {
            font-weight: bold;
            color: #333;
        }
        
        .score-board {
            display: flex;
            gap: 10px;
        }
        
        .score {
            text-align: center;
            font-size: 14px;
        }
        
        .score-value {
            font-size: 18px;
            font-weight: bold;
        }
        
        .x-score { color: #e74c3c; }
        .o-score { color: #3498db; }
        .tie-score { color: #666; }
        
        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin: 20px 0;
        }
        
        .cell {
            aspect-ratio: 1;
            background: #f9f9f9;
            border: 2px solid #ddd;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .cell:hover {
            background: #eef;
        }
        
        .cell.x { color: #e74c3c; }
        .cell.o { color: #3498db; }
        
        .game-status {
            text-align: center;
            margin: 15px 0;
            font-weight: bold;
            min-height: 24px;
        }
        
        .controls {
            display: flex;
            gap: 10px;
        }
        
        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .reset { background: #e74c3c; color: white; }
        .new-game { background: #3498db; color: white; }
        
        .winning-cell {
            background: #d4edda;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="game-info">
            <div class="player-turn">Player: <span id="current-player">X</span></div>
            <div class="score-board">
                <div class="score"><div class="score-value x-score" id="score-x">0</div><div>X</div></div>
                <div class="score"><div class="score-value tie-score" id="score-tie">0</div><div>Ties</div></div>
                <div class="score"><div class="score-value o-score" id="score-o">0</div><div>O</div></div>
            </div>
        </div>
        
        <div class="game-board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        
        <div class="game-status" id="status">Player X's turn</div>
        
        <div class="controls">
            <button class="reset" onclick="resetGame()">Reset Game</button>
            <button class="new-game" onclick="newGame()">New Game</button>
        </div>
    </div>

    <script>
        let currentPlayer = 'X';
        let board = ['','','','','','','','',''];
        let gameActive = true;
        let scores = {X: 0, O: 0, tie: 0};
        
        const winPatterns = [
            [0,1,2],[3,4,5],[6,7,8], // rows
            [0,3,6],[1,4,7],[2,5,8], // columns
            [0,4,8],[2,4,6] // diagonals
        ];
        
        function makeMove(index) {
            if (!gameActive || board[index] !== '') return;
            
            board[index] = currentPlayer;
            document.querySelector(`[data-index="${index}"]`).textContent = currentPlayer;
            document.querySelector(`[data-index="${index}"]`).classList.add(currentPlayer.toLowerCase());
            
            checkWinner();
        }
        
        function checkWinner() {
            for (let pattern of winPatterns) {
                const [a,b,c] = pattern;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    // Highlight winning cells
                    pattern.forEach(i => document.querySelector(`[data-index="${i}"]`).classList.add('winning-cell'));
                    gameActive = false;
                    scores[currentPlayer]++;
                    updateScores();
                    document.getElementById('status').textContent = `Player ${currentPlayer} wins!`;
                    return;
                }
            }
            
            if (!board.includes('')) {
                gameActive = false;
                scores.tie++;
                updateScores();
                document.getElementById('status').textContent = "It's a tie!";
                return;
            }
            
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            document.getElementById('current-player').textContent = currentPlayer;
            document.getElementById('status').textContent = `Player ${currentPlayer}'s turn`;
        }
        
        function resetGame() {
            board = ['','','','','','','','',''];
            gameActive = true;
            currentPlayer = 'X';
            document.getElementById('current-player').textContent = 'X';
            document.getElementById('status').textContent = "Player X's turn";
            
            document.querySelectorAll('.cell').forEach(cell => {
                cell.textContent = '';
                cell.classList.remove('x', 'o', 'winning-cell');
            });
        }
        
        function newGame() {
            scores = {X: 0, O: 0, tie: 0};
            updateScores();
            resetGame();
        }
        
        function updateScores() {
            document.getElementById('score-x').textContent = scores.X;
            document.getElementById('score-o').textContent = scores.O;
            document.getElementById('score-tie').textContent = scores.tie;
        }
        
        // Add event listeners
        document.querySelectorAll('.cell').forEach(cell => {
            cell.addEventListener('click', () => makeMove(cell.dataset.index));
        });
    </script>
</body>
</html>
